name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AGP 9.1 requires the API 37 platform at compile time, while its
      # default SDK Build Tools remain 36.0.0. Install both explicitly rather
      # than relying on the runner image or AGP's automatic SDK downloads.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Install Android SDK platform 37 and Build Tools 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      # The Rust `logic` library ships prebuilt in logic/src/main/jniLibs, so
      # the APK build itself needs no NDK / Rust toolchain on CI. Building it
      # from rust/ is covered by rust.yml.
      #
      # Signing: the release keystore/passwords live in repo secrets.
      # NOTE: push-triggered runs have never fired on this fork (only
      # workflow_dispatch and pull_request runs appear in history), so the
      # keystore is injected on workflow_dispatch as well. Dispatch runs can
      # only be started by users with write access, who can already manage
      # these secrets. PRs from forks have no secret access and stay unsigned,
      # which is fine for a build-check.
      - name: Inject release signing (push / manual dispatch builds)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_B64: ${{ secrets.LUMA_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.LUMA_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.LUMA_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          cat > app/release-keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASS
          keyAlias=luma
          keyPassword=$KEY_PASS
          EOF

      - name: Run local unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          # Push builds upload the signed APK; PR builds (no secrets) produce
          # the unsigned one. Match either.
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
